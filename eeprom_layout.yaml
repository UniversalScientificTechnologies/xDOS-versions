eeprom_layout:
  name: dosimeter_eeprom
  language: en
  endianness: little
  checksum:
    algorithm: crc32
    coverage: full_structure
    checksum_field_behavior: replace_checksum_bytes_with_zero_before_crc

  notes:
    - "The EEPROM layout should be represented by a fixed C/C++ struct with explicit field sizes."
    - "The same binary layout should be readable and writable from both Arduino/C++ and Python."
    - "RTC validity should be determined from RTC chip status flags."
    - "The last RTC reset/init time should be stored so the log header can contain an approximate device power-on estimate."
    - "Device variants are intentionally ignored here; this is a single unified structure."
    - "RTC history should be stored as an array of triplets, not as three separate arrays."
    - "New fields are only ever appended. format_version tells how many bytes belong to the record (see format_versions); the CRC covers exactly those bytes."
    - "Fields a record does not have read back as 0xFF from an erased EEPROM: 0xFFFF for uint16 and NaN for float, i.e. unknown."

  # Record size of each format version = offset of the end of last_field.
  format_versions:
    - version: 1
      last_field: calibration_version
      aliases: [0]
      description: "Original layout (113 B). Records written by early tools may carry format_version 0 with the same layout."
    - version: 2
      last_field: energy_range_max_mev
      description: "Adds measurement metadata: default noise channels, silicon chip geometry and energy range (131 B)."
    - version: 3
      last_field: detector_id
      description: "Adds the calibration type with its extra parameters (e.g. neutron selection) and the detector number (150 B)."

  fields:
    format_version:
      type: uint16
      description: EEPROM format version for backward compatibility

    device_type:
      type: uint16
      description: Device type identifier
      encoding: enum

    crc32:
      type: uint32
      description: Structure checksum
      crc_zero_fill: true

    hardware_version:
      type: struct
      description: Device version and hardware revision
      fields:
        device_version:
          type: uint8
          range: "1-99"
        hardware_revision:
          type: uint8
          range: "A-Z"

    device_identifier:
      type: char[24]
      description: Human-readable device identifier
      example: "animal name printed on enclosure"

    operating_modes:
      type: uint16
      description: Operating modes and configuration flags

    rtc_flags:
      type: uint8
      description: RTC capability and status flags
      bit_mapping:
        bit_0: has_rtc
        bit_1: has_rtc_backup_battery
        bit_2: rtc_initialized
        bit_3: rtc_power_loss_detected
        bit_4: geiger_mode_enabled
        bit_5: led_enabled
        bit_6: reserved
        bit_7: reserved

    rtc_history:
      type: array
      length: 5
      description: History table of RTC-related reference points
      item_type: struct
      item_fields:
        rtc_initialization_timestamp:
          type: uint32
          description: Time when RTC was reset or initialized
        reference_timestamp:
          type: uint32
          description: Periodically updated Unix timestamp of RTC counter value 0
        rtc_value_at_reference_timestamp:
          type: uint32
          description: RTC counter/state captured when the zero-time timestamp was updated

    calibration_constants:
      type: float[3]
      description: Calibration parameters

    calibration_version:
      type: uint32
      description: Calibration timestamp or calibration version

    # --- format_version 2 ---

    num_noise_channels_default:
      type: uint16
      description: Default number of leading spectrum channels with noise ($CHAN in the xDOS data format); 0xFFFF = unknown

    si_chip_area_cm2:
      type: float
      description: Sensitive area of the silicon chip in cm2 ($DIODE); NaN = unknown

    si_chip_thickness_cm:
      type: float
      description: Depletion layer thickness of the silicon chip in cm ($DIODE); NaN = unknown

    energy_range_min_mev:
      type: float
      description: Lower bound of the measured deposited energy in MeV ($ERNG); NaN = unknown

    energy_range_max_mev:
      type: float
      description: Upper bound of the measured deposited energy in MeV ($ERNG); NaN = unknown

    # --- format_version 3 ---

    calibration_type:
      type: uint16
      description: >
        How to read the calibration fields (calibration_constants,
        calibration_extra); 0xFFFF = not stated (records of version 1 and 2 -
        calibration_constants only).
      encoding: enum
      enum_values:
        1: linear
        2: linear_with_neutrons

    calibration_extra:
      type: float[4]
      description: >
        Extra calibration parameters, meaning given by calibration_type; NaN =
        unknown. linear: unused. linear_with_neutrons: [min_ch, max_ch, k, q] -
        an event above threshold is a neutron if min_ch <= ch0 <= max_ch and
        ch1 < q + k * ch0 (ch0 = amplitude, ch1 = second sample after a fixed
        delay); written to the data file as $NCALIB.

    detector_id:
      type: uint8
      description: Number of the detector within its experiment (e.g. the tab on the CZPAD display unit); 255 = unknown
